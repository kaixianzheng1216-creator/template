repos:
  - repo: local
    hooks:
      - id: local-ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        files: ^backend/app/
        require_serial: true
        language: unsupported
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --exit-non-zero-on-format
        files: ^backend/app/
        require_serial: true
        language: unsupported
        types: [python]

      - id: local-mypy
        name: mypy check
        entry: uv run mypy --config-file backend/pyproject.toml backend/app
        require_serial: true
        language: unsupported
        pass_filenames: false

      - id: local-frontend-check
        name: frontend check
        entry: pnpm --dir frontend check
        files: ^frontend/
        require_serial: true
        language: unsupported
        pass_filenames: false
