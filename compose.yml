services:

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB:?Variable not set}

  redis:
    image: redis:8.2-alpine
    command:
      - /bin/sh
      - -ec
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Variable not set}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Variable not set}
    volumes:
      - app-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  migrate:
    image: template-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Variable not set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Variable not set}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Variable not set}:${POSTGRES_PASSWORD:?Variable not set}@db:5432/${POSTGRES_DB:?Variable not set}
      REDIS_URL: redis://default:${REDIS_PASSWORD:?Variable not set}@redis:6379/0
      EMAIL_CODE_SECRET: ${EMAIL_CODE_SECRET:?Variable not set}
      RESEND_API_KEY: ${RESEND_API_KEY:?Variable not set}
      EMAIL_FROM: ${EMAIL_FROM:?Variable not set}
    command: ["alembic", "upgrade", "head"]

  backend:
    image: template-backend:latest
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    environment:
      REDIS_URL: redis://default:${REDIS_PASSWORD:?Variable not set}@redis:6379/0
      FORWARDED_ALLOW_IPS:
      DEV_LOGIN_ENABLED: "false"
      EMAIL_CODE_SECRET: ${EMAIL_CODE_SECRET:?Variable not set}
      RESEND_API_KEY: ${RESEND_API_KEY:?Variable not set}
      EMAIL_FROM: ${EMAIL_FROM:?Variable not set}
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Variable not set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Variable not set}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Variable not set}:${POSTGRES_PASSWORD:?Variable not set}@db:5432/${POSTGRES_DB:?Variable not set}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: template-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_PROJECT_NAME: ${PROJECT_NAME:?Variable not set}

volumes:
  app-db-data:
  app-redis-data:
