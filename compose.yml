services:

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  migrate:
    image: template-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      FRONTEND_URL: ${FRONTEND_URL:?Variable not set}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Variable not set}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
    command: ["alembic", "upgrade", "head"]

  backend:
    image: template-backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      FRONTEND_URL: ${FRONTEND_URL:?Variable not set}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Variable not set}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: template-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Variable not set}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Variable not set}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Variable not set}

volumes:
  app-db-data:
