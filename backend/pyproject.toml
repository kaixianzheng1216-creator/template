[project]
name = "app"
version = "0.1.0"
description = "FastAPI 后端服务"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.49.0,<1.0.0",
    "pydantic>=2.13.5",
    "alembic>=1.19.1,<2.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sqlmodel>=0.0.46,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "scalar-fastapi>=1.9.1,<2.0.0",
    "clerk-backend-api>=7.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy<3.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG001",
    "T201",
]
ignore = [
    "E501",
    "B008",
    "W191",
    "B904",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
