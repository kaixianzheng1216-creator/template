services:

  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # 通过无限循环让容器保持运行但不执行任何操作
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    environment:
      FASTAPI_ENV: "development"

  frontend:
    ports:
      - "3000:3000"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app
          ignore:
            - ./frontend/.next
            - ./frontend/node_modules
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/pnpm-lock.yaml
          action: rebuild
