services:
  redis:
    ports:
      - "6379:6379"

  db:
    ports:
      - "5432:5432"

  backend:
    environment:
      DEV_LOGIN_ENABLED: "true"
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --reload
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
            - pyproject.toml
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
        - path: ./pyproject.toml
          action: rebuild

  frontend:
    ports:
      - "3000:3000"
    build:
      target: development
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app
          ignore:
            - .next
            - node_modules
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/pnpm-lock.yaml
          action: rebuild
        - path: ./frontend/pnpm-workspace.yaml
          action: rebuild
